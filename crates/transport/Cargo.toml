[package]
name = "sametra-transport"
description = "Sametra transport: ws:// and wss:// connections, TLS, and the relay wire codec (protobuf frames / NIP-01 JSON)"
version.workspace = true
edition.workspace = true

[features]
default = ["tls"]
tls = ["dep:rustls", "dep:tokio-rustls", "dep:webpki-roots"]

[dependencies]
sametra-proto.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
rustls = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }
