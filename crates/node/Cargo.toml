[package]
name = "sametra-node"
description = "Sametra node: relay, gossip, store, reputation, protobuf API and the embedded web app"
version.workspace = true
edition.workspace = true
build = "build.rs"
default-run = "sametra"

[features]
default = ["tls", "mcp-http", "ipfs", "embed"]
tls = ["sametra-transport/tls", "sametra-mcp/tls"]
# `sametra mcp --http`: MCP over Streamable HTTP for harnesses that connect by URL
mcp-http = ["sametra-mcp/http"]
# files on IPFS through a Kubo daemon (its RPC API): /ipfs/CID, uploads, peering
ipfs = ["dep:hyper", "dep:hyper-util", "dep:http-body-util"]
# contextual standing from text embeddings, through an OpenAI-compatible /v1/embeddings service
embed = ["dep:hyper", "dep:hyper-util", "dep:http-body-util"]

[dependencies]
sametra-proto.workspace = true
sametra-transport.workspace = true
sametra-mcp.workspace = true
futures-util.workspace = true
getrandom.workspace = true
hex.workspace = true
serde_json.workspace = true
tracing.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
pulldown-cmark = { version = "0.13.6", default-features = false }
sha2.workspace = true
hyper = { version = "1", features = ["client", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"], optional = true }
http-body-util = { version = "0.1.5", optional = true }
prost = "0.14"
protox = "0.10"
prost-reflect = { version = "0.16", features = ["serde"] }

[dev-dependencies]
quick-protobuf.workspace = true
rcgen = "0.14"

[[bin]]
name = "sametra"
path = "src/main.rs"
