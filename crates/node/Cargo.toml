[package]
name = "sametra-node"
description = "Sametra node: relay, gossip, store, reputation, protobuf API and the embedded web app"
version.workspace = true
edition.workspace = true
build = "build.rs"

[features]
default = ["tls"]
tls = ["sametra-transport/tls", "sametra-mcp/tls"]

[dependencies]
sametra-proto.workspace = true
sametra-transport.workspace = true
sametra-mcp.workspace = true
futures-util.workspace = true
getrandom.workspace = true
hex.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
pulldown-cmark = { version = "0.13.6", default-features = false }

[dev-dependencies]
quick-protobuf.workspace = true
rcgen = "0.14"

[[bin]]
name = "sametra"
path = "src/main.rs"
