# The full setup: a Sametra node and the Kubo IPFS daemon it keeps files in.
#
#   docker compose up -d            # build and start both
#   open http://127.0.0.1:42424
#   docker compose exec sametra sametra call info
#
# To join a network, add peers to the node's command, e.g.
#   command: ["run", "--listen", "0.0.0.0:42424", "--peer", "node.example:42424"]
# and for a public node also "--public", "your.host:42424" and IPFS_ANNOUNCE below.
# Nodes talk to each other over libp2p (QUIC) on UDP 42424, published below.
#
# Optional: embeddings, so standing carries across posts on close subjects.
#   docker compose --profile embed up -d
# starts Ollama and pulls a small embedding model (nomic-embed-text, ~270 MB);
# then uncomment SAMETRA_EMBED_API and SAMETRA_EMBED_MODEL below.

services:
  kubo:
    image: ipfs/kubo:v0.43.1
    restart: unless-stopped
    environment:
      # IPFS_ANNOUNCE: 203.0.113.7     # this host's public IP, for other nodes to dial
      SAMETRA_IPFS_STORAGE: 20GB
    volumes:
      - kubo:/data/ipfs
      - ./docker/kubo-init.sh:/container-init.d/010-sametra.sh:ro
    ports:
      # libp2p: Bitswap with other nodes and the public IPFS network.
      # The RPC API (5001) is deliberately not published.
      - "4001:4001/tcp"
      - "4001:4001/udp"
    healthcheck:
      test: ["CMD", "ipfs", "id"]
      interval: 15s
      timeout: 5s
      start_period: 20s

  sametra:
    build: .
    image: sametra:latest
    restart: unless-stopped
    depends_on:
      kubo:
        condition: service_healthy
    environment:
      SAMETRA_IPFS_API: http://kubo:5001
      SAMETRA_LOG: info
      # requests from this host reach the container from the network's gateway:
      # treat it like localhost, so the web app can post (Host/Origin checks still apply)
      SAMETRA_TRUST_NET: 10.42.0.1/32
      # SAMETRA_API_TOKEN: change-me    # allow write tools from outside the container
      # SAMETRA_EMBED_API: http://ollama:11434/v1   # with --profile embed
      # SAMETRA_EMBED_MODEL: nomic-embed-text
    command: ["run", "--listen", "0.0.0.0:42424"]
    ports:
      # the app, the API, the nostr relay and /ipfs/ on one port; only on this
      # machine by default (write tools trust localhost; see the docs on security)
      - "127.0.0.1:42424:42424"
      # libp2p (QUIC): other nodes reach this one here
      - "42424:42424/udp"
    volumes:
      - sametra:/data

  ollama:
    profiles: [embed]
    image: ollama/ollama:0.12.3
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama

  ollama-pull:
    profiles: [embed]
    image: ollama/ollama:0.12.3
    depends_on: [ollama]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "nomic-embed-text"]
    restart: "no"

networks:
  default:
    ipam:
      config:
        - subnet: 10.42.0.0/24
          gateway: 10.42.0.1

volumes:
  kubo:
  sametra:
  ollama:
