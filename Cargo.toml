[workspace]
resolver = "3"
members = ["crates/proto", "crates/transport", "crates/node", "crates/mcp"]
# `cargo run` runs the node; use --workspace to build or test every crate
default-members = ["crates/node"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
sametra-proto = { path = "crates/proto" }
sametra-transport = { path = "crates/transport", default-features = false }
sametra-mcp = { path = "crates/mcp", default-features = false }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
getrandom = "0.2"
hex = "0.4.3"
k256 = { version = "0.14.0", default-features = false, features = ["schnorr", "std"] }
quick-protobuf = "0.8.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "macros", "time", "sync", "io-util", "signal"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
# TLS (optional everywhere): rustls on the `ring` backend, no C toolchain needed
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
